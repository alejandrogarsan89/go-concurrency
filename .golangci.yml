run:
  timeout: 3m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive

issues:
  exclude-rules:
    # Table-driven tests often shadow variables intentionally.
    - path: _test\.go
      linters:
        - errcheck
